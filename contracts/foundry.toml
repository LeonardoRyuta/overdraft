[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Aqua/SwapVM are compiled with 0.8.30; our own code targets ^0.8.13 and is compatible.

[rpc_endpoints]
mainnet = "https://ethereum-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"

# Note: public RPCs serve fork state at/near `latest` but gate deep-archive reads.
# A pinned-block reproducible fork needs an archive RPC key (see docs/PRIZE-TRACKS.md ask).
